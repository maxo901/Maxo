<!doctype html>
<html lang="fa" dir="rtl" data-theme="classic" data-dark="0" data-pat="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Messenger</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- first run: language -->
<div id="langPick" class="lang-pick hidden"></div>

<!-- sign in / sign up (no e-mail code) -->
<div id="auth" class="auth hidden">
  <div class="auth-card">
    <div class="logo" id="logo"></div>
    <h1 id="appName"></h1>
    <p class="sub" data-i18n="auth.sub"></p>
    <div class="tabs">
      <button type="button" id="tabLogin" class="on" data-i18n="auth.login"></button>
      <button type="button" id="tabReg" data-i18n="auth.register"></button>
    </div>

    <form id="formLogin" autocomplete="on">
      <label class="field"><span data-i18n="auth.user_or_email"></span><input id="lgLogin" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
      <label class="field"><span data-i18n="auth.password"></span><input id="lgPass" type="password" autocomplete="current-password" required></label>
      <div class="err" id="lgErr"></div>
      <button class="btn block" type="submit" data-i18n="auth.login"></button>
    </form>

    <form id="formReg" class="hidden" autocomplete="on">
      <label class="field"><span data-i18n="auth.display_name"></span><input id="rgName" maxlength="40" autocomplete="name" required></label>
      <label class="field"><span data-i18n="auth.username"></span><input id="rgUser" maxlength="20" autocomplete="username" autocapitalize="off" spellcheck="false" dir="ltr" required><div class="hint" id="rgUserHint" data-i18n="auth.username_hint"></div></label>
      <label class="field"><span data-i18n="auth.email_opt"></span><input id="rgEmail" type="email" autocomplete="email" dir="ltr"></label>
      <label class="field"><span data-i18n="auth.password"></span><input id="rgPass" type="password" minlength="8" autocomplete="new-password" required><div class="hint" data-i18n="auth.password_hint"></div></label>
      <div class="err" id="rgErr"></div>
      <button class="btn block" type="submit" data-i18n="auth.register"></button>
    </form>
    <button class="auth-lang" id="authLang" type="button"></button>
  </div>
</div>

<!-- app -->
<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <button class="icon-btn" id="btnMenu" type="button" data-i18n-aria="menu"></button>
      <label class="search"><span id="searchIc"></span><input id="search" type="search" autocomplete="off" data-i18n-ph="search"></label>
    </div>
    <div id="storyBar" class="story-bar"></div>
    <div id="chatList" class="chat-list"></div>
    <button class="fab" id="fab" type="button" data-i18n-aria="new_message"></button>
  </aside>

  <main class="chat-pane" id="chatPane">
    <div class="chat-empty" id="chatEmpty" data-i18n="pick_chat"></div>

    <section class="chat-view hidden" id="chatView">
      <header class="chat-head">
        <button class="icon-btn back-btn" id="btnBack" type="button"></button>
        <div class="who" id="chatWho" role="button" tabindex="0">
          <span id="headAv"></span>
          <div class="grow">
            <div class="t1 ellipsis" id="headTitle"></div>
            <div class="t2 ellipsis" id="headSub"></div>
          </div>
        </div>
        <button class="icon-btn" id="btnChatMenu" type="button"></button>
      </header>

      <div class="msgs" id="msgs"><div class="msgs-inner" id="msgList"></div></div>
      <button class="jump hidden" id="jump" type="button"><span id="jumpBadge"></span></button>

      <div class="ctx-bar hidden" id="ctxBar">
        <span id="ctxIc"></span><div class="bar"></div>
        <div class="txt"><b id="ctxTitle"></b><span class="ellipsis" id="ctxText" style="display:block"></span></div>
        <button class="icon-btn" id="ctxClose" type="button"></button>
      </div>
      <div class="emoji-panel hidden" id="emojiPanel"></div>
      <div class="no-post hidden" id="noPost"></div>

      <footer class="composer" id="composer">
        <button class="icon-btn" id="btnAttach" type="button"></button>
        <div class="box" id="composerBox">
          <textarea id="input" rows="1" maxlength="4000" data-i18n-ph="message_ph" enterkeyhint="send"></textarea>
        </div>
        <button class="icon-btn" id="btnEmoji" type="button"></button>
        <button class="send" id="btnSend" type="button"></button>
      </footer>
    </section>
  </main>
</div>

<div id="panels" class="panels"></div>
<div id="views" class="views"></div>
<div id="pop" class="pop hidden"></div>
<div id="toasts" class="toasts"></div>

<input type="file" id="fileAny" class="hidden" multiple>
<input type="file" id="fileMedia" class="hidden" accept="image/*,video/*" multiple>
<input type="file" id="fileOne" class="hidden" accept="image/*">

<script src="/socket.io/socket.io.js"></script>
<script src="/i18n.js"></script>
<script src="/core.js"></script>
<script src="/editor.js"></script>
<script src="/stories.js"></script>
<script src="/panels.js"></script>
<script src="/app.js"></script>
</body>
</html>
