<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3390ec">
  <title>پیام‌رسان</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" media="print" onload="this.media='all'">
  <script>
    (function () {
      var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>

<!-- ============ Auth ============ -->
<div id="auth" class="auth hidden">
  <button class="icon-btn theme-corner" id="themeAuth" type="button" aria-label="تغییر تم"></button>
  <div class="auth-card">
    <div class="brand">
      <div class="logo" id="logo"></div>
      <h1 class="brand-name">پیام‌رسان</h1>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="login" type="button">ورود</button>
      <button class="tab" data-tab="reg" type="button">ثبت‌نام</button>
    </div>
    <p id="authErr" class="auth-err" role="alert"></p>

    <form id="loginForm" class="stack">
      <label class="field"><span>ایمیل یا آیدی</span>
        <input class="inp" name="login" autocomplete="username" required dir="ltr"></label>
      <label class="field"><span>رمز عبور</span>
        <input class="inp" name="password" type="password" autocomplete="current-password" required dir="ltr"></label>
      <button class="btn block">ورود</button>
    </form>

    <form id="regEmailForm" class="stack hidden">
      <label class="field"><span>ایمیل</span>
        <input class="inp" name="email" type="email" autocomplete="email" required dir="ltr" placeholder="you@example.com"></label>
      <button class="btn block">ارسال کد تأیید</button>
      <p class="hint">یک کد ۶ رقمی به این ایمیل ارسال می‌شود.</p>
    </form>

    <form id="regForm2" class="stack hidden">
      <p class="hint" id="regSent"></p>
      <label class="field"><span>کد تأیید</span>
        <input class="inp code" name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required dir="ltr" placeholder="••••••"></label>
      <label class="field"><span>آیدی (یکتا)</span>
        <input class="inp" id="regUser" name="username" maxlength="20" autocomplete="off" required dir="ltr" placeholder="my_id">
        <small id="userStatus" class="hint"></small></label>
      <label class="field"><span>نام نمایشی</span>
        <input class="inp" name="display_name" maxlength="40" required autocomplete="name"></label>
      <label class="field"><span>رمز عبور (حداقل ۸ کاراکتر)</span>
        <input class="inp" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required dir="ltr"></label>
      <button class="btn block">ساخت حساب</button>
      <div class="row-links">
        <button type="button" class="link" id="resendBtn">ارسال دوباره کد</button>
        <button type="button" class="link" id="changeEmail">تغییر ایمیل</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ App ============ -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="side-head">
      <button class="icon-btn" id="btnMenu" type="button" aria-label="منو"></button>
      <input class="search" id="search" type="search" placeholder="جستجو…" autocomplete="off">
    </div>
    <div id="onlineStrip" class="online-strip hidden"></div>
    <div id="chatList" class="chat-list"></div>
  </aside>

  <main class="chat-pane" id="chatPane">
    <div id="emptyState" class="empty-state"><span>یک گفتگو را انتخاب کنید</span></div>

    <section id="chatView" class="chat-view hidden">
      <header class="chat-head">
        <button class="icon-btn back" id="btnBack" type="button" aria-label="بازگشت"></button>
        <div class="head-info" id="headInfo">
          <span id="headAv"></span>
          <div class="head-text">
            <div class="head-title" id="headTitle"></div>
            <div class="head-sub" id="headSub"></div>
          </div>
        </div>
        <button class="icon-btn hidden" id="btnChatMenu" type="button" aria-label="تنظیمات گروه"></button>
      </header>

      <div class="msg-scroll" id="msgScroll"><div class="msg-inner" id="msgList"></div></div>
      <button class="jump hidden" id="jumpDown" type="button" aria-label="رفتن به آخرین پیام"><span id="jumpBadge" class="badge hidden"></span></button>

      <div class="composer-wrap">
        <div class="upbar hidden" id="upbar"><i></i></div>
        <div class="ctx-bar hidden" id="ctxBar"></div>
        <div class="closed-note hidden" id="closedNote">این گروه بسته است؛ فقط مالک می‌تواند پیام بدهد.</div>
        <form class="composer" id="composer" autocomplete="off">
          <button class="icon-btn" id="btnAttach" type="button" aria-label="پیوست فایل"></button>
          <input type="file" id="fileInput" multiple hidden>
          <textarea id="input" rows="1" dir="rtl" placeholder="پیام…" maxlength="4000"></textarea>
          <button class="send" id="btnSend" type="button"></button>
        </form>
        <div class="rec-bar hidden" id="recBar">
          <button class="icon-btn" id="recCancel" type="button" aria-label="لغو"></button>
          <span class="rec-dot"></span><span id="recTime">0:00</span>
          <span class="grow"></span>
          <button class="send" id="recSend" type="button" aria-label="ارسال"></button>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="modals"></div>
<div id="menu" class="pop hidden"></div>
<div id="toasts"></div>
<div id="lightbox" class="lightbox hidden"><img id="lbImg" alt=""></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
